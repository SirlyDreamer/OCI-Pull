name: Build portable packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  MACOSX_DEPLOYMENT_TARGET: '15.0'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: bash tools/install-linux-deps.sh
      - name: Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add '${{ matrix.target }}'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml') }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --release --all-targets --target '${{ matrix.target }}' -- -D warnings
      - name: Tests
        run: cargo test --locked --release --all-targets --target '${{ matrix.target }}' -- --test-threads=1
      - name: Build
        run: cargo build --locked --release --bins --target '${{ matrix.target }}'
      - name: Portable archive
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          python tools/collect-licenses.py --target '${{ matrix.target }}' --output target/THIRD-PARTY-LICENSES.txt
          python tools/package.py --target '${{ matrix.target }}' --licenses target/THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish portable release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: portable-*
          merge-multiple: true
          path: dist
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state; then
            test "$(cat release-state)" = true || { echo 'Release is already published'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "OCI Pull $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" *.zip *.tar.gz SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
